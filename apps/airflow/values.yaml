airflow:
  images:
    airflow:
      repository: apache/airflow
      tag: "2.8.1"

  executor: "KubernetesExecutor"

  webserver:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  scheduler:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  workers:
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "16"
  # Передаем переменные, чтобы официальный образ создал нужного юзера и БД
  primary:
    env:
      - name: POSTGRES_USER
        value: "airflow"
      - name: POSTGRES_PASSWORD
        value: "airflow"
      - name: POSTGRES_DB
        value: "airflow"
